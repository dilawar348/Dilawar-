<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special Girl ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.15);
            max-width: 400px;
            width: 90%;
            border: 2px solid #ffb3c6;
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: all 0.5s ease;
        }
        .heart-main {
            font-size: 70px;
            color: #ff4b6e;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        h1 {
            color: #ff4b6e;
            font-size: 28px;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        .btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff4b6e, #ff758f);
            color: white;
        }
        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 75, 110, 0.4);
        }
        #noBtn {
            background-color: #f0f0f0;
            color: #555;
            position: absolute;
            transition: all 0.2s ease;
        }
        /* Success Screen */
        .hidden {
            display: none;
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        /* Floating Hearts */
        .heart-particle {
            position: absolute;
            color: #ff4b6e;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Main Question Box -->
    <div class="container" id="questionBox">
        <div class="heart-main">💖</div>
        <h1>Kia tum mujh se muhabbat karti ho? ✨</h1>
        <p>I want to ask you from the bottom of my heart... Will you be mine forever? 💍</p>
        
        <div class="btn-group">
            <button class="btn" id="yesBtn" onclick="sayYes()">Yes! ❤️</button>
            <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <!-- Success Box (Yeh tab dikhega jab woh Yes karein gi) -->
    <div class="container hidden" id="successBox">
        <div class="success-icon">🎉🥰❤️</div>
        <h1>I Knew It! 💖</h1>
        <p>I love you so much! Tum ne mera din bana diya. Thank you for being mine! 🌸✨</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const questionBox = document.getElementById('questionBox');
        const successBox = document.getElementById('successBox');

        // Initial position of No button inside the button group
        noBtn.style.left = "160px";
        noBtn.style.top = "0px";

        function moveNoButton() {
            // Screen ki width aur height nikalna mobile/desktop ke mutabiq
            const padding = 60;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Random coordinates generate karna
            let randomX = Math.floor(Math.random() * maxX);
            let randomY = Math.floor(Math.random() * maxY);

            // Button ko absolute position dena taake woh poori screen par kahin bhi bhaag sake
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function sayYes() {
            // Question box chupana aur success box dikhana
            questionBox.classList.add('hidden');
            successBox.classList.remove('hidden');

            // Hearts barshana
            for (let i = 0; i < 50; i++) {
                setTimeout(createHeart, i * 100);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            
            const hearts = ['❤️', '💖', '💝', '💕', '✨'];
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
